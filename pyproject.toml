[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eulerlib"
version = "0.1.0"
description = "Project Euler solutions, one function per problem, tested against known answers"
requires-python = ">=3.9"
dependencies = [
    "qrcode>=7.0",
]

[project.scripts]
vitalsdash = "vitalsdash.__main__:main"
recall = "recall.__main__:main"
ttt = "ttt.__main__:main"
shortlink = "shortlink.__main__:main"
quest = "quest.__main__:main"
babble = "babble.__main__:main"
kvlog = "kvlog.__main__:main"
toylang = "toylang.__main__:main"
searchlite = "searchlite.__main__:main"
vcslite = "vcslite.__main__:main"
chesslite = "chesslite.__main__:main"
nanosql = "nanosql.__main__:main"
procman = "procman.__main__:main"
regexlite = "regexlite.__main__:main"
autograd-nn = "autograd.__main__:main"
gridsheet = "gridsheet.__main__:main"

[tool.setuptools]
packages = ["eulerlib", "vitalsdash", "recall", "ttt", "shortlink", "quest", "babble", "kvlog", "toylang", "searchlite", "vcslite", "chesslite", "nanosql", "procman", "regexlite", "autograd", "gridsheet"]

[tool.setuptools.package-data]
eulerlib = ["resources/*.txt"]
vitalsdash = ["sample/*.csv"]
quest = ["games/*.json"]
