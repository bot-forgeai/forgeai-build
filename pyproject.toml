[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eulerlib"
version = "0.1.0"
description = "Project Euler solutions, one function per problem, tested against known answers"
requires-python = ">=3.9"

[project.scripts]
vitalsdash = "vitalsdash.__main__:main"

[tool.setuptools]
packages = ["eulerlib", "vitalsdash"]

[tool.setuptools.package-data]
eulerlib = ["resources/*.txt"]
vitalsdash = ["sample/*.csv"]
